name: Déploiement production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Tourne sur les push vers main ET sur chaque pull request vers main —
  # c'est ce meme job (lint -> test -> build) que la fusion attend au vert
  # via la protection de branche (Settings > Branches > main > Require
  # status checks : "test"). build-and-push/deploy restent reserves au push
  # sur main (cf. leurs conditions if ci-dessous) : une PR ne publie ni ne
  # deploie jamais d'image.
  test:
    runs-on: ubuntu-latest
    # Memes images que infra/docker-compose.yml (postgis/postgis, valkey) —
    # un conteneur de service ephemere par job, jamais la vraie base prod.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: urbanflow
          POSTGRES_PASSWORD: urbanflow_ci
          POSTGRES_DB: urbanflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://urbanflow:urbanflow_ci@localhost:5432/urbanflow
      CACHE_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-jamais-utilise-en-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-jamais-utilise-en-prod
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      WEB_ORIGIN: http://localhost:3000
      TISSEO_API_KEY: ci-dummy-key
      TISSEO_GTFS_RT_URL: https://ci.invalid/gtfs-rt
      GBFS_VELOTOULOUSE_URL: https://ci.invalid/gbfs
      GBFS_YEGO_URL: https://ci.invalid/gbfs
      OTP_URL: https://ci.invalid/otp
      # Paire jetable generee pour la CI uniquement (web-push valide le format
      # a l'instanciation de PushService) — sans rapport avec les vraies cles
      # VAPID de production.
      VAPID_SUBJECT: mailto:ci@urbanflow.test
      VAPID_PUBLIC_KEY: BHHV9Xr1wyfnwZsWMF0VbnuY67dFbJMbPDHG3Are0AzHSppVt1TZHnykNvYcpj1i2k7CeAIdF1H4FAfK-6wPD5g
      VAPID_PRIVATE_KEY: Dg1jTh0kDiSoadA9Bd74nxSUbPbN01DjktC8Kqfzh60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sans ca, PrismaClient reste non type (any/error) pour ESLint sur un
      # runner neuf : le postinstall de Prisma est bloque par defaut par
      # pnpm (meme comportement observe en local, cf. docs/avancement.md).
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter @urbanflow/shared build
      - run: pnpm --filter api lint
      - run: pnpm --filter web lint
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api db:seed
      # Plus d'exclusion : le conteneur postgis ci-dessus fournit une vraie
      # base pour le test d'integration ST_DWithin (Phase 3/11).
      - run: pnpm --filter api exec jest
      # Tests e2e Nest (RGPD export/suppression, profil) — AppModule complet,
      # meme base et Valkey que ci-dessus.
      - run: pnpm --filter api test:e2e

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR exige un nom de depot entierement en minuscules — le proprietaire
      # GitHub (github.repository_owner) peut contenir des majuscules
      # (ex. enzo-DC), ce que les expressions GitHub Actions ne savent pas
      # convertir nativement. Trouve en conditions reelles : "repository name
      # must be lowercase" au premier essai avec ${{ github.repository_owner }}
      # utilise tel quel dans le tag.
      - name: Calculer le nom de depot GHCR en minuscules
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build et push l'image api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/urban_flow-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/urban_flow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push l'image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/urban_flow-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/urban_flow-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Secrets a configurer cote GitHub (Settings > Secrets and variables >
      # Actions) : VPS_HOST, VPS_USER, VPS_SSH_KEY (cle privee), et
      # optionnellement VPS_PORT (par defaut 22). Aucun de ces secrets
      # n'existe encore a la redaction de ce workflow — le VPS n'est pas
      # provisionne (voir docs/avancement.md, Phase 12).
      - name: Se connecter au VPS et redeployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/urban_flow
            # Garde infra/docker-compose.prod.yml et infra/Caddyfile a jour
            # avec le depot, pas seulement les images applicatives.
            git pull --ff-only origin main
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d
            docker image prune -f
