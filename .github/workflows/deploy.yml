name: Déploiement production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/urban_flow-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/urban_flow-web

jobs:
  # Garde-fou minimal avant de deployer — la CI complete (e2e, axe-core en
  # continu) reste le sujet de la Phase 11, pas anticipee ici, mais on ne
  # pousse jamais en prod sans au moins lint + tests unitaires au vert.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sans ca, PrismaClient reste non type (any/error) pour ESLint sur un
      # runner neuf : le postinstall de Prisma est bloque par defaut par
      # pnpm (meme comportement observe en local, cf. docs/avancement.md).
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter @urbanflow/shared build
      - run: pnpm --filter api lint
      - run: pnpm --filter web lint
      - run: pnpm --filter api exec jest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build et push l'image api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push l'image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Secrets a configurer cote GitHub (Settings > Secrets and variables >
      # Actions) : VPS_HOST, VPS_USER, VPS_SSH_KEY (cle privee), et
      # optionnellement VPS_PORT (par defaut 22). Aucun de ces secrets
      # n'existe encore a la redaction de ce workflow — le VPS n'est pas
      # provisionne (voir docs/avancement.md, Phase 12).
      - name: Se connecter au VPS et redeployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/urban_flow
            # Garde infra/docker-compose.prod.yml et infra/Caddyfile a jour
            # avec le depot, pas seulement les images applicatives.
            git pull --ff-only origin main
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d
            docker image prune -f
