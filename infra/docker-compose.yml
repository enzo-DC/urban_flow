services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:9
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE (Phase 3) : ce service a besoin d'un graphe construit dans ./otp (graph.obj) pour
  # répondre correctement. Tant que la Phase 3 n'a pas été traitée, il démarre puis s'arrête
  # faute de données — ce n'est pas bloquant pour les autres services.
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.7.0
    restart: "no"
    command: ["--load", "/var/opentripplanner"]
    ports:
      - "8080:8080"
    volumes:
      - ./otp:/var/opentripplanner

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  cache_data:
