services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:9
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nécessite un graphe construit dans ./otp (graph.obj) — voir infra/otp/README.md.
  # L'image fixe elle-même le répertoire de base à /var/opentripplanner (entrypoint), inutile
  # de le repasser en argument de commande.
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.9.0
    restart: unless-stopped
    command: ["--load"]
    environment:
      JAVA_OPTS: "-Xmx6G"
    ports:
      - "8080:8080"
    volumes:
      - ./otp:/var/opentripplanner
    healthcheck:
      # Pas de wget/curl dans l'image (Ubuntu minimal, jib) : simple test de connexion TCP.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  cache_data:
